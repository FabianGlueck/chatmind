name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range: engines.node (22.22) up to the newest LTS line.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  desktop:
    # Desktop spec §1: packaging breaks in ways typecheck and tests cannot see (native modules, staging).
    name: desktop (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chatmind/desktop run pack
      - name: native modules load in the packed app
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          app=$(ls -d apps/desktop/release/mac*/chatmind.app)
          "$app/Contents/MacOS/chatmind" -e "
            const dir = require('node:path').resolve(process.argv[1], 'Contents/Resources/app/node_modules') + '/';
            const db = new (require(dir + 'better-sqlite3'))(':memory:');
            require(dir + 'sqlite-vec').load(db);
            console.log(db.prepare('select vec_version() v').get());
          " "$app"
